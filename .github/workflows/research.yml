name: Explicit isolated local-model validation

# Test-branch-only continuation of the existing exact-SHA dispatch route.
# No PR, scheduled or automatic push execution. No publication or model on Mac.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed commit on test/isolated-local-model
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: azt-research-reviewed-integration
  cancel-in-progress: false
jobs:
  research:
    if: >-
      github.repository == 'ralfyishere/agent-zero-trust' &&
      github.event.repository.private == false &&
      github.actor == 'ralfyishere' && github.triggering_actor == 'ralfyishere' &&
      github.run_attempt == 1 && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/test/isolated-local-model' && inputs.source_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify explicit selection before checking out execution code
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          python3 -I - <<'PY'
          import os, re
          expected = os.environ['EXPECTED_SOURCE']
          assert re.fullmatch('[0-9a-f]{40}', expected)
          assert expected == os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY'] == 'ralfyishere/agent-zero-trust'
          assert os.environ['GITHUB_ACTOR'] == os.environ['GITHUB_TRIGGERING_ACTOR'] == 'ralfyishere'
          print('Selected reviewed source:', expected)
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Explicit setup download — existing pinned build tools
        timeout-minutes: 2
        run: |
          python3 -m venv "$RUNNER_TEMP/research-build"
          "$RUNNER_TEMP/research-build/bin/python" -m pip --isolated --disable-pip-version-check --no-cache-dir --timeout 20 --retries 1 install --only-binary=:all: --no-deps setuptools==83.0.0 wheel==0.47.0 packaging==26.0
      - name: Build and test exact candidate without Docker or model execution
        timeout-minutes: 3
        run: |
          "$RUNNER_TEMP/research-build/bin/python" scripts/release_candidate.py --output "$RUNNER_TEMP/research-build-record"
          python3 -m venv "$RUNNER_TEMP/research-installed"
          "$RUNNER_TEMP/research-installed/bin/python" -m pip --isolated --no-cache-dir install --no-index --no-deps "$RUNNER_TEMP/research-build-record/dist"/*.whl
      - name: Explicit isolated image and model setup, then two synthetic live sessions
        timeout-minutes: 10
        run: |
          cd "$RUNNER_TEMP"
          timeout --signal=TERM --kill-after=10s 540s "$RUNNER_TEMP/research-installed/bin/python" -I "$GITHUB_WORKSPACE/scripts/test_live_model.py" --output "$RUNNER_TEMP/azt-live-evidence"
      - name: Exact-resource cleanup and sanitized evidence, even after failure
        if: always()
        timeout-minutes: 1
        run: |
          if test -x "$RUNNER_TEMP/research-installed/bin/python"; then
            "$RUNNER_TEMP/research-installed/bin/python" -I "$GITHUB_WORKSPACE/scripts/test_live_model.py" --cleanup --output "$RUNNER_TEMP/azt-live-evidence"
          fi
          python3 -I "$GITHUB_WORKSPACE/scripts/research_ci_evidence.py" --evidence "$RUNNER_TEMP/azt-live-evidence/evaluation.json" --dist "$RUNNER_TEMP/research-build-record/dist"
      # Explicit downloads: pinned Official Python linux/amd64 image, pinned
      # upstream Ollama0.34.2 linux/amd64 image, fixed qwen3:0.6b model (~523MB).
      # Image/model digests and every model blob are checked. No source text is
      # supplied until download service is removed and inference has network none.
      # No artifacts/caches, OIDC, application secrets, public ports or write token.
