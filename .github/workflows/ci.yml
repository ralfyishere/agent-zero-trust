name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pins verified against upstream release commit links. To update, review the
# upstream changelog and full tag commit, replace SHA + version comment, rerun CI.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: corpus + unit tests (incl. false-positive and known-miss ledgers)
        run: |
          python test_azt.py
          python -m unittest discover -s tests -v
      - name: unfiltered self-scan for review (not an admission check)
        env:
          AZT_REPORT_PATH: ${{ runner.temp }}/azt-self-scan.json
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          result = subprocess.run([sys.executable, "azt.py", "scan", ".", "--json"], capture_output=True, text=True, timeout=120)
          assert result.returncode in (0, 1), result.stderr
          report = json.loads(result.stdout)
          assert isinstance(report["findings"], list)
          assert isinstance(report["inventory"], list)
          assert isinstance(report["scope"]["complete"], bool)
          assert "decision" in report
          pathlib.Path(os.environ["AZT_REPORT_PATH"]).write_text(result.stdout, encoding="utf-8")
          print("Review artifact: %d unsuppressed findings; inspection complete=%s" % (len(report["findings"]), report["scope"]["complete"]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: self-scan-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/azt-self-scan.json
          retention-days: 14
          if-no-files-found: error
      - name: package builds
        run: python -m pip install --quiet build && python -m build
      - name: install wheel in a clean environment and verify real CLI results
        run: python scripts/test_artifact.py dist
      - name: reproduce intake evidence from the built wheel (not runtime containment)
        env:
          AZT_EVIDENCE_PATH: ${{ runner.temp }}/azt-evidence
        run: python scripts/containmentbench.py --wheel dist/*.whl --output "$AZT_EVIDENCE_PATH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intake-evidence-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/azt-evidence/
          retention-days: 14
          if-no-files-found: error

  action-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: action runs the local candidate on the benign fixture
        uses: ./
        with:
          path: corpus/benign-repo
      - name: prepare inert comparison snapshots (maintainer test code)
        env:
          AZT_LAB_PATH: ${{ runner.temp }}/azt-action-lab
        run: python3 -I scripts/action_lab.py --output "$AZT_LAB_PATH"
      - name: candidate Action compares explicit snapshots and reports MEDIUM below HIGH
        uses: ./
        with:
          base-path: ${{ runner.temp }}/azt-action-lab/base snapshot
          path: ${{ runner.temp }}/azt-action-lab/head snapshot
          fail-on: high
      - name: assert expected HIGH/failure exits without treating fixture failures as CI failures
        run: python3 -m unittest discover -s tests -p test_action_review.py -v
      - name: acquire explicit current PR base (no target execution)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: snapshots/base
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: acquire actual PR head (not synthetic merge)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: snapshots/head
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: test candidate helper on full explicit base and head (corpus HIGH exit expected)
        if: github.event_name == 'pull_request'
        env:
          AZT_SCAN_PATH: snapshots/head
          AZT_BASE_PATH: snapshots/base
          AZT_HEAD_LABEL: ${{ github.event.pull_request.head.sha }}
          AZT_BASE_LABEL: ${{ github.event.pull_request.base.sha }}
        run: python3 -I scripts/test_action_ci.py
      # Exact malicious exit code AND finding are checked by test_artifact.py.
      # An arbitrary failed installation must never count as malicious detection.
