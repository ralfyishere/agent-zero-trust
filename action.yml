name: "agent-zero-trust scan"
description: "Zero-trust repo intake for AI coding agents: fail on known-shape injection/execution risks in the instruction environment before an agent (or a reviewer) trusts the tree."
branding:
  icon: "shield"
  color: "red"
inputs:
  path:
    description: "Directory to scan"
    required: false
    default: "."
  fail-on:
    description: "Severity that fails the job: high, medium, or any"
    required: false
    default: "high"
  version:
    description: "Optional PyPI override: exact numeric version or latest; empty uses the scanner in this action checkout"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        AZT_ACTION_VERSION: ${{ inputs.version }}
        AZT_SCAN_PATH: ${{ inputs.path }}
        AZT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        case "$AZT_FAIL_ON" in
          high|medium|any) ;;
          *) echo "azt: invalid fail-on input" >&2; exit 2 ;;
        esac
        if [ -z "$AZT_ACTION_VERSION" ]; then
          SPEC="$GITHUB_ACTION_PATH"
        elif [ "$AZT_ACTION_VERSION" = latest ]; then
          SPEC=agent-zero-trust
        elif [[ "$AZT_ACTION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([ab][0-9]+|rc[0-9]+)?$ ]]; then
          SPEC="agent-zero-trust==$AZT_ACTION_VERSION"
        else
          echo "azt: version must be numeric, latest, or empty" >&2
          exit 2
        fi
        # Inputs stay data, including shell metacharacters and leading dashes.
        # Install only this trusted action checkout; target contents are never built.
        pipx run --no-cache --spec "$SPEC" azt scan --json --fail-on "$AZT_FAIL_ON" -- "$AZT_SCAN_PATH"
