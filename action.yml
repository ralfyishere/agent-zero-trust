name: "agent-zero-trust scan"
description: "Zero-trust repo intake for AI coding agents: fail on known-shape injection/execution risks in the instruction environment before an agent (or a reviewer) trusts the tree."
branding:
  icon: "shield"
  color: "red"
inputs:
  path:
    description: "Directory to scan"
    required: false
    default: "."
  fail-on:
    description: "Severity that fails the job: high, medium, or any"
    required: false
    default: "high"
  version:
    description: "Optional PyPI override: exact numeric version or latest; empty uses the scanner in this action checkout"
    required: false
    default: ""
  base-path:
    description: "Optional separate checked-out baseline directory; never fetched by AZT"
    required: false
    default: ""
  head-label:
    description: "Optional full checkout commit SHA label, caller supplied (not authenticated)"
    required: false
    default: ""
  base-label:
    description: "Optional full baseline commit SHA label, caller supplied (not authenticated)"
    required: false
    default: ""
  job-summary:
    description: "Write a bounded GitHub summary (true or false); paths/labels may be sensitive"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - shell: /usr/bin/env -u BASH_ENV -u ENV /bin/bash --noprofile --norc -euo pipefail {0}
      env:
        AZT_ACTION_VERSION: ${{ inputs.version }}
        AZT_SCAN_PATH: ${{ inputs.path }}
        AZT_FAIL_ON: ${{ inputs.fail-on }}
        AZT_BASE_PATH: ${{ inputs.base-path }}
        AZT_HEAD_LABEL: ${{ inputs.head-label }}
        AZT_BASE_LABEL: ${{ inputs.base-label }}
        AZT_JOB_SUMMARY: ${{ inputs.job-summary }}
      run: |
        set -euo pipefail
        # Standard Ubuntu host interpreter, not a target-supplied PATH entry.
        # Python starts isolated and outside either supplied snapshot.
        cd -- "$RUNNER_TEMP"
        exec /usr/bin/python3 -I "$GITHUB_ACTION_PATH/scripts/action_review.py"
