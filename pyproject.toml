[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-zero-trust"
version = "0.1.16"
description = "Offline repository inspection for coding-agent instructions: scan, compare, explain, and export a local review."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rafael Pena" }]
keywords = ["ai-agents", "prompt-injection", "claude-code", "agent-security", "zero-trust", "cursor", "supply-chain"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/ralfyishere/agent-zero-trust"
Issues = "https://github.com/ralfyishere/agent-zero-trust/issues"

[project.scripts]
azt = "azt:main"

[tool.setuptools]
py-modules = ["azt", "azt_intake", "azt_gate", "azt_runtime", "azt_config", "azt_docker", "azt_safety", "azt_safety_pack", "azt_review", "azt_sensitive", "azt_research", "azt_research_broker", "azt_research_runtime", "azt_research_worker"]
packages = ["azt_resources"]

[tool.setuptools.package-data]
azt_resources = ["*.json"]
