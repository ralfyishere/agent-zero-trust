<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100" viewBox="0 0 720 1100" role="img" aria-labelledby="title description"><title id="title">Review a sensitive request before sharing</title><desc id="description">Illustration of actual AZT 0.1.13 CLI output. A synthetic API-key upload request yields one MEDIUM sensitive-disclosure finding. A version-only control yields none. Default HIGH threshold returns exit 0 for both, not approval. No target instructions were executed.</desc><rect x="0" y="0" width="720" height="1100" rx="0" fill="#090e17" stroke="none"/><text x="32" y="43" fill="#56e0ee" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">AZT / REVIEW BEFORE SHARING</text><text x="32" y="104" fill="#f6f9ff" font-size="36" font-weight="700" font-family="Arial, Helvetica, sans-serif">Helpful request. Sensitive access.</text><text x="34" y="145" fill="#b4c4d9" font-size="26" font-weight="400" font-family="Arial, Helvetica, sans-serif">What is this asking you to disclose?</text><rect x="24" y="177" width="672" height="285" rx="16" fill="#111d2d" stroke="#29405b"/><text x="48" y="217" fill="#f6f9ff" font-size="24" font-weight="700" font-family="'Courier New', monospace">CONTRIBUTING.md</text><text x="48" y="250" fill="#b4c4d9" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Synthetic instruction · never executed</text><path d="M48 269H672" stroke="#29405b" stroke-width="1"/><rect x="40" y="292" width="640" height="54" rx="6" fill="#49382c" stroke="none"/><text x="52" y="328" fill="#ffbc69" font-size="31" font-weight="700" font-family="Arial, Helvetica, sans-serif">Upload your API keys</text><text x="52" y="373" fill="#b4c4d9" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">to [example destination].</text><text x="49" y="420" fill="#b4c4d9" font-size="20" font-weight="400" font-family="Arial, Helvetica, sans-serif">URL omitted from this illustration.</text><rect x="24" y="480" width="672" height="342" rx="16" fill="#111d2d" stroke="#56e0ee"/><text x="48" y="520" fill="#56e0ee" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">REVIEW BEFORE SHARING</text><g opacity="1"><text x="49" y="573" fill="#ffbc69" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif">1 finding · MEDIUM</text><text x="49" y="610" fill="#b4c4d9" font-size="21" font-weight="400" font-family="'Courier New', monospace">request.sensitive_disclosure</text><text x="49" y="670" fill="#f6f9ff" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Verify the request and recipient.</text><text x="49" y="714" fill="#b4c4d9" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Share only what is necessary.</text><text x="49" y="758" fill="#b4c4d9" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Inspect the exact contents first.</text></g><rect x="24" y="842" width="672" height="104" rx="16" fill="#122637" stroke="#29405b"/><text x="48" y="875" fill="#56e0ee" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif">A LIMITED CONTROL</text><text x="48" y="908" fill="#f6f9ff" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">“Send only the Python version. Do not include API keys…”</text><text x="48" y="935" fill="#b4c4d9" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Same installed scanner: 0 sensitive-request findings.</text><text x="32" y="979" fill="#ffbc69" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">Default HIGH threshold: exit 0 ≠ no findings or approval.</text><text x="32" y="1014" fill="#b4c4d9" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Illustrated recorded CLI workflow · AZT 0.1.13 · not a graphical app</text><text x="32" y="1045" fill="#b4c4d9" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Bounded English review. No upload, target execution or automatic repair.</text></svg>
