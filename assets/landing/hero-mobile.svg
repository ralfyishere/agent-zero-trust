<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-labelledby="title description"><title id="title">AZT: Know what changed. Before you delegate.</title><desc id="description">Offline repository inspection and change review for AI coding agents. A recorded synthetic AGENTS.md change produced two new findings, not runtime blocking.</desc><rect x="0" y="0" width="720" height="600" rx="0" fill="#090e17" stroke="none"/><rect x="32" y="32" width="5" height="39" rx="0" fill="#56e0ee" stroke="none"/><text x="54" y="67" fill="#f6f9ff" font-size="45" font-weight="700" font-family="Arial, Helvetica, sans-serif">AZT</text><text x="177" y="65" fill="#b4c4d9" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">AGENT ZERO TRUST</text><text x="32" y="155" fill="#f6f9ff" font-size="55" font-weight="700" font-family="Arial, Helvetica, sans-serif">Know what changed.</text><text x="32" y="221" fill="#f6f9ff" font-size="55" font-weight="700" font-family="Arial, Helvetica, sans-serif">Before you delegate.</text><text x="34" y="273" fill="#b4c4d9" font-size="24" font-weight="400" font-family="Arial, Helvetica, sans-serif">Offline repository inspection and change review</text><text x="34" y="310" fill="#b4c4d9" font-size="24" font-weight="400" font-family="Arial, Helvetica, sans-serif">for AI coding agents.</text><rect x="32" y="357" width="656" height="141" rx="16" fill="#111d2d" stroke="#29405b"/><text x="54" y="394" fill="#56e0ee" font-size="22" font-weight="700" font-family="'Courier New', monospace">AGENTS.md</text><text x="54" y="437" fill="#f6f9ff" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif">Instruction changed</text><text x="54" y="473" fill="#ffbc69" font-size="25" font-weight="400" font-family="Arial, Helvetica, sans-serif">2 new findings to review</text><text x="34" y="552" fill="#b4c4d9" font-size="22" font-weight="700" font-family="Arial, Helvetica, sans-serif">SCAN  /  COMPARE  /  EXPLAIN  /  EXPORT</text><text x="34" y="581" fill="#b4c4d9" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif">Recorded synthetic example · source 0296facec256</text></svg>
