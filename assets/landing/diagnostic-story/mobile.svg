<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1020" viewBox="0 0 720 1020" role="img" aria-labelledby="title description"><title id="title">A diagnostic request changes. Review before sharing.</title><desc id="description">Illustration of released AZT CLI results on two frozen synthetic lab inputs. A version-and-log-setting request has zero findings. A broad diagnostic-sharing request has one new MEDIUM finding. The advice is to verify the request, share only the minimum necessary and inspect the exact contents. No diagnostics were gathered or transmitted in response to the request. Not a live graphical interface.</desc><rect x="0" y="0" width="720" height="1020" rx="0" fill="#090e17" stroke="none"/><text x="28" y="44" fill="#56e0ee" font-size="26" font-weight="700" font-family="Arial, Helvetica, sans-serif">AZT</text><text x="102" y="43" fill="#b4c4d9" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif">READ THE REQUEST. KEEP THE CHOICE.</text><text x="28" y="103" fill="#f6f9ff" font-size="38" font-weight="700" font-family="Arial, Helvetica, sans-serif">The debugging guide changed.</text><text x="29" y="144" fill="#b4c4d9" font-size="26" font-weight="400" font-family="Arial, Helvetica, sans-serif">Same project. A bigger ask.</text><rect x="33" y="186" width="664" height="425" rx="3" fill="#17212d" stroke="none"/><rect x="28" y="178" width="664" height="425" rx="3" fill="#f3f0e8" stroke="none"/><rect x="28" y="178" width="5" height="425" rx="0" fill="#87d5d3" stroke="none"/><text x="58" y="218" fill="#142333" font-size="21" font-weight="700" font-family="'Courier New', monospace">README.md</text><text x="488" y="217" fill="#51606c" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">SELECTED PASSAGES</text><path d="M58 237H662" stroke="#ccd0cb" stroke-width="1"/><g opacity="0.0000" transform="translate(0 -9.00)"><text x="58" y="285" fill="#142333" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif">Minimal diagnostics</text><text x="58" y="343" fill="#142333" font-size="32" font-weight="400" font-family="Arial, Helvetica, sans-serif">Share only the Python version</text><text x="58" y="383" fill="#142333" font-size="32" font-weight="400" font-family="Arial, Helvetica, sans-serif">and the value of AZT_LOG_LEVEL</text><text x="58" y="423" fill="#142333" font-size="32" font-weight="400" font-family="Arial, Helvetica, sans-serif">in your report.</text><text x="58" y="479" fill="#51606c" font-size="25" font-weight="400" font-family="Arial, Helvetica, sans-serif">Keep credentials and private configuration</text><text x="58" y="511" fill="#51606c" font-size="25" font-weight="400" font-family="Arial, Helvetica, sans-serif">on your local machine.</text></g><g opacity="1.0000" transform="translate(0 0.00)"><text x="58" y="282" fill="#142333" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif">Contributing</text><text x="58" y="324" fill="#51606c" font-size="25" font-weight="400" font-family="Arial, Helvetica, sans-serif">… gather full environment details …</text><rect x="55" y="348" width="230.6206896551724" height="33" rx="1" fill="#f4ce82" stroke="none"/><text x="59" y="374" fill="#142333" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">shell history</text><rect x="55" y="386" width="377.37931034482756" height="33" rx="1" fill="#f4ce82" stroke="none"/><text x="59" y="412" fill="#142333" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">environment variables</text><rect x="55" y="424" width="406.0689655172414" height="33" rx="1" fill="#f4ce82" stroke="none"/><text x="59" y="450" fill="#142333" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">the contents of the local</text><rect x="55" y="462" width="329.9310344827586" height="33" rx="1" fill="#f4ce82" stroke="none"/><text x="59" y="488" fill="#142333" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">configuration folder</text><text x="58" y="539" fill="#51606c" font-size="24" font-weight="400" font-family="Arial, Helvetica, sans-serif">… and share them at the address listed …</text></g><g opacity="0.0000" transform="translate(0 -9.00)"><g opacity="0.0000" transform="translate(0 -9.00)"><text x="34" y="652" fill="#f6f9ff" font-size="34" font-weight="700" font-family="Arial, Helvetica, sans-serif">A limited request.</text><text x="34" y="703" fill="#b4c4d9" font-size="30" font-weight="400" font-family="Arial, Helvetica, sans-serif">A software version.</text><text x="34" y="741" fill="#b4c4d9" font-size="30" font-weight="400" font-family="Arial, Helvetica, sans-serif">One named log setting.</text><text x="34" y="813" fill="#56e0ee" font-size="23" font-weight="400" font-family="Arial, Helvetica, sans-serif">0 findings in the saved scan</text></g><g opacity="1.0000" transform="translate(0 0.00)"><text x="34" y="652" fill="#f6f9ff" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">Now it asks for more.</text><text x="34" y="705" fill="#b4c4d9" font-size="30" font-weight="400" font-family="Arial, Helvetica, sans-serif">History. Environment.</text><text x="34" y="744" fill="#b4c4d9" font-size="30" font-weight="400" font-family="Arial, Helvetica, sans-serif">Local configuration.</text><text x="34" y="813" fill="#56e0ee" font-size="22" font-weight="400" font-family="Arial, Helvetica, sans-serif">The wording changed. Look closer.</text></g></g><g opacity="1.0000" transform="translate(0 0.00)"><g opacity="0.0000" transform="translate(0 -9.00)"><text x="34" y="652" fill="#ffbc69" font-size="35" font-weight="700" font-family="Arial, Helvetica, sans-serif">Before you share…</text><text x="34" y="704" fill="#f6f9ff" font-size="29" font-weight="400" font-family="Arial, Helvetica, sans-serif">These materials may contain</text><text x="34" y="743" fill="#f6f9ff" font-size="29" font-weight="400" font-family="Arial, Helvetica, sans-serif">credentials or private activity.</text><text x="34" y="807" fill="#ffbc69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">1 new finding · MEDIUM</text><text x="34" y="842" fill="#b4c4d9" font-size="18" font-weight="400" font-family="'Courier New', monospace">request.sensitive_disclosure</text><text x="34" y="876" fill="#b4c4d9" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">Not proof that secrets are present.</text></g><g opacity="1.0000" transform="translate(0 0.00)"><text x="34" y="652" fill="#56e0ee" font-size="44" font-weight="700" font-family="Arial, Helvetica, sans-serif">Ask for less.</text><text x="34" y="706" fill="#f6f9ff" font-size="30" font-weight="400" font-family="Arial, Helvetica, sans-serif">Verify the request.</text><text x="34" y="747" fill="#f6f9ff" font-size="30" font-weight="400" font-family="Arial, Helvetica, sans-serif">Share only what is necessary.</text><text x="34" y="788" fill="#f6f9ff" font-size="30" font-weight="400" font-family="Arial, Helvetica, sans-serif">Inspect the exact contents first.</text><text x="34" y="830" fill="#b4c4d9" font-size="24" font-weight="400" font-family="Arial, Helvetica, sans-serif">May contain credentials</text><text x="34" y="860" fill="#b4c4d9" font-size="24" font-weight="400" font-family="Arial, Helvetica, sans-serif">or private activity.</text><text x="34" y="903" fill="#56e0ee" font-size="22" font-weight="400" font-family="Arial, Helvetica, sans-serif">1 MEDIUM finding · local report</text></g></g><path d="M28 921H692" stroke="#29405b" stroke-width="1"/><g opacity="0.0000" transform="translate(0 -9.00)"><g opacity="0.0000" transform="translate(0 -9.00)"><text x="28" y="948" fill="#56e0ee" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">01  /  SAVE A BASELINE</text></g><g opacity="1.0000" transform="translate(0 0.00)"><text x="28" y="948" fill="#56e0ee" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">02  /  COMPARE THE CHANGE</text></g></g><g opacity="1.0000" transform="translate(0 0.00)"><text x="28" y="948" fill="#56e0ee" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">03  /  REVIEW BEFORE SHARING</text></g><g opacity="1.0000" transform="translate(0 0.00)"><text x="28" y="980" fill="#b4c4d9" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">HIGH threshold not exceeded ≠ approval</text></g><text x="28" y="1005" fill="#b4c4d9" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Illustrated recorded CLI workflow · 0.1.14 · not a graphical app</text></svg>
