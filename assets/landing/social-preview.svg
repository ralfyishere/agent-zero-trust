<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description"><title id="title">AZT: Know what changed. Before you delegate.</title><desc id="description">Offline repository inspection and change review. Free, local and open source.</desc><rect x="0" y="0" width="1280" height="640" rx="0" fill="#090e17" stroke="none"/><rect x="62" y="61" width="6" height="67" rx="0" fill="#56e0ee" stroke="none"/><text x="89" y="125" fill="#f6f9ff" font-size="86" font-weight="700" font-family="Arial, Helvetica, sans-serif">AZT</text><text x="62" y="269" fill="#f6f9ff" font-size="85" font-weight="700" font-family="Arial, Helvetica, sans-serif">Know what changed.</text><text x="62" y="373" fill="#f6f9ff" font-size="85" font-weight="700" font-family="Arial, Helvetica, sans-serif">Before you delegate.</text><text x="66" y="441" fill="#b4c4d9" font-size="32" font-weight="400" font-family="Arial, Helvetica, sans-serif">Offline repository inspection + change review</text><path d="M64 493H1216" stroke="#29405b" stroke-width="1"/><text x="66" y="551" fill="#56e0ee" font-size="24" font-weight="700" font-family="Arial, Helvetica, sans-serif">AGENT ZERO TRUST</text><text x="66" y="595" fill="#b4c4d9" font-size="23" font-weight="400" font-family="Arial, Helvetica, sans-serif">Free. Local. Open source.</text><text x="814" y="551" fill="#f6f9ff" font-size="24" font-weight="700" font-family="Arial, Helvetica, sans-serif">SCAN → COMPARE</text><text x="814" y="593" fill="#f6f9ff" font-size="24" font-weight="700" font-family="Arial, Helvetica, sans-serif">EXPLAIN → EXPORT</text></svg>
